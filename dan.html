<script>
let battleDB = [];
let pillSearchText = "";

// ==============================================
// 載入戰力統計資料
// ==============================================
async function loadBattleStats() {
    try {
        console.log("🌐 正在從 Firebase 讀取 [battleStats]...");
        const snapshot =
            await dbFirebase.ref("戰力統計").once("value");
        const data = snapshot.val();
        if (!data) {
            console.warn("⚠️ battleStats 沒有資料");
            return;
        }
        battleDB =
            Array.isArray(data)
                ? data
                : Object.values(data);
        console.log("✅ 戰力統計資料讀取成功！");
        console.log("📦 共讀取", battleDB.length, "筆資料");
        switchMainTab("一般丹");// 預設開啟第一個主分類
        console.table(battleDB);
        
    } catch (error) {
        console.error(
            "❌ 讀取 battleStats 失敗：",
            error
        );
    }
}

// ==============================================
// Firebase → 自動產生小分類按鈕
// ==============================================
function renderSubTabs(mainCategory, mainItems) {
    const subNav = document.getElementById("battle-sub-nav");
    subNav.innerHTML = "";
    const subCategories = [
        ...new Set(
            mainItems
                .map(item => String(item.小分類 || "").trim())
                .filter(Boolean) )
    ];

    console.log(`📂 ${mainCategory} 找到 ${subCategories.length} 個小分類：`,
        subCategories
    );

    subCategories.forEach((subName, index) => {
        const button = document.createElement("button");
        button.className = "sub-btn";
        if (index === 0) {
            button.classList.add("active");
        }

        button.textContent = subName;
        button.onclick = function () {
            subNav.querySelectorAll(".sub-btn")
                .forEach(btn =>
                    btn.classList.remove("active")
                );
            button.classList.add("active");
            renderBattleItems(
                mainCategory,
                subName
            );
        };

        subNav.appendChild(button);
    });

    if (subCategories.length > 0) {
        renderBattleItems(
            mainCategory,
            subCategories[0]
        );
    }
}

// ==============================================
// 格式化
// ==============================================
//格式化數字
function cleanNumber(value, decimals = 10) {
    if (!Number.isFinite(Number(value))) return 0;
    const num = Number(value);
    return Number(
        num.toFixed(decimals)
    );
}
// 格式化戰力效果：0.03 → 3%
function formatEffect(label, value) {
    if (value === null || value === undefined) {
        return "";
    }

    const text = String(value).trim();
    // 空白
    if (!text) {return "";}

    const num = cleanNumber(value);
    //非數字0
    if (num === 0) {return "";}
    // 小於 1 → 為百分比
    if (num > 0 && num < 1) {
        const percent = cleanNumber(num * 100, 6);
        return `,${label}+${percent}%`;
    }
    // 一般數值
    return `,${label}+${cleanNumber(num)}`;
}




// ==============================================
// 計算單顆丹藥 × 已食用數量
// ==============================================
function calculateTotalEffects(item, count) {
    const totalEffects = [];
    const effectFields = [
        ["攻", item.攻擊],
        ["防", item.防禦],
        ["爆", item.爆擊],
        ["爆傷", item.爆傷],
        ["抗爆", item.抗爆],
        ["命中", item.命中],
        ["閃", item.閃避],
        ["反", item.反擊],
        ["血", item.氣血],
    ];

    effectFields.forEach(([label, value]) => {
        const num = Number(value);
        if (!Number.isFinite(num) || num === 0) {
            return;
        }

        const total = cleanNumber(num * count);
        // 小於1=為百分比
        if (num > 0 && num < 1) {
            const percent = cleanNumber(total * 100, 6);
            totalEffects.push(
                `,${label}+${percent}%`
            );
        } else {
            totalEffects.push(
                `,${label}+${cleanNumber(total)}`
            );
        }
    });
    return totalEffects.length > 0
        ? totalEffects.join(" ")
        : "無關戰力";
}


// ==============================================
// 列表渲染 → 自動產生丹藥列表
// ==============================================
function renderBattleItems(mainCategory, subCategory) {
    const container = document.getElementById("battle-items");
    if (!container) {
        console.warn("⚠️ 找不到丹藥列表容器：battle-items");
        return;
    }

    container.innerHTML = "";
    // ======================================
    // ① 取得要顯示的資料
    // ======================================
    let items;

    if (pillSearchText) {
        // 全域搜尋：整份 battleDB
        items = battleDB.filter(item => {
            const name = String(item.名稱 || "").trim();
            const effects = [
                formatEffect("攻", item.攻擊),
                formatEffect("防", item.防禦),
                formatEffect("爆", item.爆擊),
                formatEffect("爆傷", item.爆傷),
                formatEffect("抗爆", item.抗爆),
                formatEffect("命中", item.命中),
                formatEffect("閃", item.閃避),
                formatEffect("反", item.反擊),
                formatEffect("血", item.氣血),
                String(item.其它功能 || "").trim()
            ]
            .filter(Boolean)
            .join(" ");

            // 第一欄：名稱
            // 第二欄：效果
            const searchText =
                `${name} ${effects}`.toLowerCase();
            return searchText.includes(pillSearchText);
        });

    } else {

        // 一般瀏覽：主分類＋小分類
        items = battleDB.filter(item =>
            String(item.主分類 || "").trim() === mainCategory &&
            String(item.小分類 || "").trim() === subCategory
        );
    }


    // ======================================
    // ② 沒有搜尋結果
    // ======================================
    if (items.length === 0) {
        container.innerHTML = `
            <div class="card" style="text-align:center; padding:20px; color:#777;">
                ${
                    pillSearchText
                    ? `⚠️ 找不到「${pillSearchText}」相關丹藥`
                    : `⚠️ 找不到符合「${subCategory}」的丹藥資料`
                }
            </div>
        `;

        return;
    }


    // ======================================
    // ③ 建立丹藥列表
    // ======================================
    items.forEach(item => {
        const name = String(item.名稱 || "無資料");
        const limit = Number(item.上限) || 0;
        const main = String(item.主分類 || "");
        const sub = String(item.小分類 || "");
        const pillKey =
            `${main}__${sub}__${name}`;

        // 已食用數量
        const savedCount =
            Number(playerRecord.pills[pillKey]) || 0;
        const count =
            Math.max(0, Math.min(savedCount, limit));

        // ======================================
        // 效果文字
        // ======================================
        const effects = [
            formatEffect("攻", item.攻擊),
            formatEffect("防", item.防禦),
            formatEffect("爆", item.爆擊),
            formatEffect("爆傷", item.爆傷),
            formatEffect("抗爆", item.抗爆),
            formatEffect("命中", item.命中),
            formatEffect("閃", item.閃避),
            formatEffect("反", item.反擊),
            formatEffect("血", item.氣血),
            String(item.其它功能 || "").trim()
        ]
        .filter(Boolean);

        const effectText =
            effects.length > 0
            ? effects.join(" ")
            : "無資料";

        // ======================================
        // 累計效果
        // ======================================
        const totalEffectText =
            calculateTotalEffects(item, count);

        // ======================================
        // 建立卡片
        // ======================================
        const card =
            document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <table class="pill-table">
                <tr>
                    <!-- 第一欄：名稱 -->
                    <td class="pill-name">
                        ${name}
                        ${
                            pillSearchText
                            ? `<br>
                               <small style=" color:#777; font-weight:normal;">
                                   [${main}-${sub}]
                               </small>`
                            : ""}
                    </td>

                    <!-- 第二欄：效果 -->
                    <td class="pill-text pill-effect" title="${effectText}">
                        ${effectText}
                    </td>
                </tr>

                <tr>
                    <!-- 已食用 -->
                    <td class="pill-count">
                        <input
                            type="number"
                            class="pill-count-input"
                            value="${count}"
                            min="0"
                            max="${limit}"
                            data-pill-key="${pillKey}"
                            data-limit="${limit}">

                        <span>/${limit}</span>
                    </td>

                    <!-- 累計效果 -->
                    <td class="pill-text pill-total"
                        title="${totalEffectText}">
                        ${totalEffectText}
                    </td>
                </tr>
            </table>
        `;


        // ======================================
        // 數量輸入
        // ======================================
        const input =
            card.querySelector(".pill-count-input");
        input.addEventListener("input", function () {
            let value = Number(this.value);
            if (!Number.isFinite(value)) {
                value = 0;
            }

            value = Math.max(0, Math.min(value, limit));
            this.value = value;

            // 儲存
            playerRecord.pills[pillKey] = value;
            savePlayerRecord();

            // 更新累計
            const totalElement =
                card.querySelector(".pill-total");
            if (totalElement) {
                const updatedTotal =
                    calculateTotalEffects(item, value);
                totalElement.textContent =
                    updatedTotal;
                totalElement.title =
                    updatedTotal;
            }
        });

        container.appendChild(card);

    });
}

// 多角色 LocalStorage 資料管理
// ==============================================
const STORAGE_KEY = "jin_pill_battle_record_multi";
// 多角色主要資料結構
let multiPlayerDB = {
    currentRole: "", // 目前選取
    roles: {}
};
// 全域使用的單一角色（保持相容性）
let playerRecord = {
    playerName: "",
    pills: {},
    playerStats: { 攻擊: 0, 防禦: 0, 爆擊: 0, 爆傷: 0, 抗爆: 0, 命中: 0, 閃避: 0, 反擊: 0, 氣血: 0 }
};


// ==============================================
// 讀取紀錄
// ==============================================
function loadPlayerRecord() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            if (data && typeof data === "object" && data.roles) {
                multiPlayerDB = data;
            }
        }
    } catch (error) {
        console.error("❌ 讀取紀錄失敗：", error);
    }

    updateRoleSelectOptions();

    // 如果先前有選取的角色，直接載入
    if (multiPlayerDB.currentRole && multiPlayerDB.roles[multiPlayerDB.currentRole]) {
        loadRoleData(multiPlayerDB.currentRole);
    } else {
        clearCurrentRecordUI();
    }
}


// ==============================================
// 儲存目前角色 (自動儲存)
// ==============================================
function savePlayerRecord() {
    try {
        const pName = playerRecord.playerName.trim();
        if (pName) {
            multiPlayerDB.roles[pName] = JSON.parse(JSON.stringify(playerRecord));
            multiPlayerDB.currentRole = pName;
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(multiPlayerDB));
        updateRoleSelectOptions();
    } catch (error) {
        console.error("❌ 儲存失敗：", error);
    }
}
// ==============================================
// 角色下拉選單（含 新增 與 刪除）
// ==============================================
function updateRoleSelectOptions() {
    const select = document.getElementById("role-select");
    if (!select) return;
    let html = `<option value="__NEW__">➕[新手加入]</option>`;
    // 加入已有角色
    const roleNames = Object.keys(multiPlayerDB.roles);
    roleNames.forEach(roleName => {
        const isSelected = (roleName === multiPlayerDB.currentRole) ? "selected" : "";
        html += `<option value="${roleName}" ${isSelected}>👤 ${roleName}</option>`;
    });

    // 若當前已有效角色，才顯示「刪除當前」選項
    if (multiPlayerDB.currentRole && multiPlayerDB.roles[multiPlayerDB.currentRole]) {
        html += `<option value="__DELETE__" style="color: red;">🗑️ [踢除當前：${multiPlayerDB.currentRole}]</option>`;
    }
    select.innerHTML = html;
}


// 下拉選單動作分流處理
function handleRoleSelect(value) {
    if (value === "__NEW__") {
        // 僅清空畫面，不刪除任何資料
        clearCurrentRecordUI();
        showToast("✨ 已重置，新高手加入即可建立檔案！");
    } else if (value === "__DELETE__") {
        // 執行刪除當前角色
        deleteCurrentRole();
    } else {
        // 切換至選取的角色
        loadRoleData(value);
        showToast(`🔄 已切換至大俠：${value}`);
    }
}

// 載入特定角色資料到畫面
function loadRoleData(roleName) {
    if (!multiPlayerDB.roles[roleName]) return;
    
    multiPlayerDB.currentRole = roleName;
    playerRecord = JSON.parse(JSON.stringify(multiPlayerDB.roles[roleName]));

    const nameInput = document.getElementById("player-name");
    if (nameInput) {
        nameInput.value = playerRecord.playerName || "";
    }
    searchPills(); // 重載列表與食用
    savePlayerRecord(); // 儲存目前的 currentRole 狀態
}

// // 清空畫面 (不影響 LocalStorage 已存角色)
function clearCurrentRecordUI() {
    multiPlayerDB.currentRole = "";
    playerRecord = {
        playerName: "",
        pills: {},
        playerStats: { 攻擊: 0, 防禦: 0, 爆擊: 0, 爆傷: 0, 抗爆: 0, 命中: 0, 閃避: 0, 反擊: 0, 氣血: 0 }
    };

    const nameInput = document.getElementById("player-name");
    if (nameInput) nameInput.value = "";

    updateRoleSelectOptions();
    searchPills();
}

// ==============================================
// 儲存/更新玩家名稱 (多角色相容版)
// ==============================================
function savePlayerName() {
    const input = document.getElementById("player-name");
    if (!input) return;

    const newName = input.value.trim();
    const oldName = playerRecord.playerName ? playerRecord.playerName.trim() : "";

    // 1. 若名字沒變或打空白，不做處理
    if (!newName || newName === oldName) {
        input.value = oldName; // 若打空白，自動還原舊名
        return;
    }

    // 2. 判斷是否為「修改現有角色名稱」
    if (oldName && multiPlayerDB.roles[oldName]) {
        // 跳出提示問使用者意圖
        const isRename = confirm(
            `❓ ⚠️偵測到大俠名稱變更：\n\n` +
            `【按下 確定】: 將原大俠「${oldName}」改名為「${newName}」\n` +
            `【按下 取消】: 保留「${oldName}」，並以「${newName}」建立全新大俠`
        );

        if (isRename) {
            // 使用者要「改名」：刪除舊 key
            delete multiPlayerDB.roles[oldName];
            showToast(`✏️ 大俠已改名為：${newName}`);
        } else {
            // 使用者要「開新角色」：複製一份當前資料給新角色，保留舊角色
            showToast(`✨ 新加入大俠已建檔：${newName}`);
        }
    } else {
        showToast(`✨ 新高手已建檔：${newName}`);
    }

    // 3. 更新記憶體資料與當前選取角色
    playerRecord.playerName = newName;
    multiPlayerDB.currentRole = newName;

    // 4. 自動儲存並更新下拉選單
    savePlayerRecord();
}

// 刪除當前角色
function deleteCurrentRole() {
    const roleToDelete = multiPlayerDB.currentRole;
    if (!roleToDelete || !multiPlayerDB.roles[roleToDelete]) return;

    if (confirm(`⚠️ 確定踢除大俠「${roleToDelete}」嗎？此動作無法復原！（建議先下載JSON備份）`)) {
        delete multiPlayerDB.roles[roleToDelete];
        clearCurrentRecordUI();
        savePlayerRecord();
        showToast(`🗑️ 已成功踢除：${roleToDelete}，若有下載備份，匯入 JSON 檔案，可取回大俠資料~`);
    } else {
        // 若點擊取消，還原下拉選單選取狀態
        updateRoleSelectOptions();
    }
}


// ==============================================
// 戰力與剩餘需求計算核心
// ==============================================
function calculatePlayerStats() {
    const stats = {
        攻擊: 0, 防禦: 0, 爆擊: 0, 爆傷: 0,
        抗爆: 0, 命中: 0, 閃避: 0, 反擊: 0, 氣血: 0
    };
    
    const neededList = []; // 紀錄還需多少顆
    // ① 計算丹藥戰力 & 收集未吃滿清單
    battleDB.forEach(item => {
        const name = String(item.名稱 || "");
        const main = String(item.主分類 || "");
        const sub = String(item.小分類 || "");
        const limit = Number(item.上限) || 0;
        const pillKey = `${main}__${sub}__${name}`;//`
        const count = Number(playerRecord.pills[pillKey]) || 0;
        
        // 累計戰力
        const fields = [
            ["攻擊", item.攻擊], ["防禦", item.防禦], ["爆擊", item.爆擊],
            ["爆傷", item.爆傷], ["抗爆", item.抗爆], ["命中", item.命中],
            ["閃避", item.閃避], ["反擊", item.反擊], ["氣血", item.氣血]
        ];

        fields.forEach(([key, value]) => {
            const num = Number(value);
            if (Number.isFinite(num) && count > 0) {
                stats[key] += num * count;
            }
        });

        // 收集剩餘需求
        if (limit > 0 && count < limit) {
            neededList.push({
                name: name,
                needed: limit - count
            });
        }
    });

    // ② 加上玩家自行輸入面板數值
    const playerStats = playerRecord.playerStats || {};
    Object.keys(stats).forEach(key => {
        const value = Number(playerStats[key]) || 0;
        stats[key] += value;
    });

    // ③ 清理小數點
    Object.keys(stats).forEach(key => {
        stats[key] = cleanNumber(stats[key], 6);
    });

    return { stats, neededList };
}


// ==============================================
// 渲染 Modal 畫面內容
// ==============================================
function updateStatsModal() {
    const { stats, neededList } = calculatePlayerStats();
    
    // 1. 渲染屬性
    const summaryContainer = document.getElementById("stat-summary-list");
    summaryContainer.innerHTML = Object.entries(stats)
        .map(([attr, val]) => `<div><strong>${attr}:</strong> ${val}</div>`)
        .join("");

    // 2. 渲染剩餘需求
    const neededContainer = document.getElementById("stat-needed-list");
    if (neededList.length === 0) {
        neededContainer.innerHTML = `<li style="color:#16a34a;">🎉 恭喜！所有丹藥均已食用完畢！</li>`;
    } else {
        neededContainer.innerHTML = neededList
            .map(item => `<li><strong>${item.name}:</strong> 還需 ${item.needed} 顆</li>`)
            .join("");
    }
}
// 開關統計視窗
function toggleModal(show) {
    if (show) { updateStatsModal();}
    document.getElementById("stats-modal").style.display =
        show ? "flex" : "none";
}


// ==============================================
// 產生分享格式文字
// ==============================================
function generateShareText() {
    const { stats, neededList } = calculatePlayerStats();
    const pName = playerRecord.playerName || "無名大俠";
    
    let text = `【大俠：${pName} 的戰力統計】\n\n`;
    text += `【總累計戰力】\n`;
    Object.entries(stats).forEach(([attr, val]) => {
        text += `${attr}: ${val}\n`;
    });

    text += `\n【剩餘需求 / 願望清單】\n`;
    if (neededList.length === 0) {
        text += `丹藥已全數吃滿！\n`;
    } else {
        neededList.forEach(item => {
            text += `${item.name}: 還需 ${item.needed} 顆\n`;
        });
    }
    return text;
}

// 匯入 JSON 檔案
function importDataBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            // 驗證匯入的資料格式
            if (importedData && typeof importedData === 'object' && importedData.pills) {
                playerRecord = importedData;
                savePlayerRecord(); // 寫入 LocalStorage[cite: 1]
                // 更新 UI[cite: 1]
                const nameInput = document.getElementById("player-name");
                if (nameInput) nameInput.value = playerRecord.playerName || "";
                
                searchPills(); // 重新渲染畫面[cite: 1]
                showToast(`✅ 成功載入大俠【${playerRecord.playerName || '無名'}】的紀錄！`);
            } else {
                alert("❌ 備份檔案格式不正確！");
            }
        } catch (err) {
            console.error("匯入失敗：", err);
            alert("❌ 讀取檔案失敗，請確認是否為正確的 JSON 備份檔！");
        }
    };
    reader.readAsText(file);
    event.target.value = ""; // 清空 input 讓同檔名可重複觸發
}

// ==============================================
// 1. 匯出完整 JSON 備份檔案
function exportDataBackup() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(playerRecord, null, 2));
    const downloadAnchor = document.createElement('a');
    const fileName = `${playerRecord.playerName || '大俠'}_戰力備份.json`;//`
    
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", fileName);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

// 2. 複製分享文字到剪貼簿
function copyShareText() {
    const text = generateShareText();
    navigator.clipboard.writeText(text).then(() => {
        alert("📋 戰力統計文字已成功複製到剪貼簿！");
    }).catch(err => {
        console.error("複製失敗：", err);
        alert("複製失敗，請手動複製。");
    });
}

// 3. 原生 Web Share API (支援手機彈出 LINE / 簡訊等)
async function shareToLineOrOther() {
    const text = generateShareText();
    if (navigator.share) {
        try {
            await navigator.share({
                title: '大俠丹藥紀錄戰力統計',
                text: text,
            });
        } catch (err) {
            console.log("取消分享或分享失敗", err);
        }
    } else {
        // 不支援 Web Share 時回退至複製
        copyShareText();
    }
}

// 4. 下載記事本 (.txt)
function downloadTxtFile(playerName) {
    const textContent = generateShareText();
    const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${playerName}_戰力統計表.txt`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
}
