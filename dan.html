/* =========================
   丹藥表格 - 基礎結構與通用格線
   ========================= */
.pill-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
}

/* 統一管理表格儲存格內邊距與對齊 */
.pill-table th,
.pill-table td {
    padding: 4px 6px;
    vertical-align: middle;
    text-align: left;
}
/* 表頭與表身邊框樣式 */
.pill-table thead tr {
    font-size: 0.8rem;
    color: #666;
    border-bottom: 1px solid #ddd;
}

.pill-table tbody tr {
    font-size: 0.85rem;
    border-bottom: 1px dashed #eee;
}

/* =========================
   獨立欄位與通用文字元件
   ========================= */
/* 共用背景設定 (名稱欄與數量欄) */
.pill-name,
.pill-count,
.threshold-header {
    background: var(--bg);
}

/* 第 1 欄：名稱 (含圓點標籤) */
.pill-name {
    width: 110px;
    font-weight: bold;
    white-space: nowrap;
}

.pill-name::before {
    content: "";
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-right: 1px;
    background: var(--bg3);
    border-radius: 50%;
    vertical-align: middle;
}

/* 第 2、3、4 欄寬度與置中 */
.pill-effect { width: auto; }
.pill-total  { width: 120px; }
.pill-count,
.pill-table .col-status {
    text-align: center;
    white-space: nowrap;
}

.pill-table .col-status { width: 65px; }

/* 長文字溢出省略處理 */
.pill-text {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #777;
}

   輸入框樣式
   ========================= */

    <script>
      let battleDB = [];
      let pillSearchText = "";
      // ==============================================
      // 【工具 1】統一管理屬性.全域常數定義
      // ==============================================
      const ATTRIBUTES_MAP = [
        { short: '攻', full: '攻擊', key: '攻擊' },
        { short: '防', full: '防禦', key: '防禦' },
        { short: '爆', full: '爆擊', key: '爆擊' },
        { short: '爆傷', full: '爆傷', key: '爆傷' },
        { short: '抗爆', full: '抗爆', key: '抗爆' },
        { short: '命中', full: '命中', key: '命中' },
        { short: '閃', full: '閃避', key: '閃避' },
        { short: '反', full: '反擊', key: '反擊' },
        { short: '血', full: '氣血', key: '氣血' }
      ];
      // ==============================================
      // 【工具 2】獨立的格式化邏輯
      // ==============================================
      //格式化數字
      function cleanNumber(value, decimals = 10) {
          if (!Number.isFinite(Number(value))) return 0;
          const num = Number(value);
          return Number(
              num.toFixed(decimals)
          );
      }
      /**** 格式化單一屬性字串
       * @param {string} label - 屬性簡稱 (如 '攻')
       * @param {number} totalValue - 計算後的總數值 (單顆數值 * 數量)
       * @param {number} baseValue - 單顆丹藥的基礎數值 (用來判斷是否為百分比)
      ****/
      // 格式化戰力效果：0.03 → 3%
      function formatEffect(label, value) {
          if (value === null || value === undefined) {
              return "";
          }
          const text = String(value).trim();
          // 空白
          if (!text) {return "";}

          const num = cleanNumber(value);
          //非數字0
          if (num === 0) {return "";}
          // 小於 1 → 為百分比
          if (num > 0 && num < 1) {
              const percent = cleanNumber(num * 100, 6);
              return `${label}+${percent}%,`;
          }
          // 一般數值
          return `${label}+${cleanNumber(num)},`;
      }



      // ==============================================
      // 載入戰力資料

      async function loadBattleStats() {
          try {
              console.log("🌐 正在從 Firebase 讀取 [battleStats]...");
              const snapshot = await dbFirebase.ref("戰力統計").once("value");
              const data = snapshot.val();
              if (!data) { console.warn("⚠️ battleStats 沒有資料");
                  return; }
              battleDB = Array.isArray(data)? data : Object.values(data);
              console.log("✅ 戰力統計資料讀取成功！");
              console.log("📦 共讀取", battleDB.length, "筆資料");
              switchMainTab("一般丹");// 預設開啟第一個主分類
              console.table(battleDB);
          } catch (error) {console.error("❌ 讀取 battleStats 失敗：", error);}
      }

      // ==============================================

          const subCategories = [
              ...new Set( mainItems
                      .map(item => String(item.小分類 || "").trim())

          console.log(`📂 ${mainCategory} 找到 ${subCategories.length} 個小分類：`,
              subCategories
          );

          subCategories.forEach((subName, index) => {
              const button = document.createElement("button");
              button.className = "sub-btn";
              if (index === 0) {button.classList.add("active");}
              button.textContent = subName;

              button.onclick = function () {
                  //點擊小分類時，自動清空搜尋框與搜尋文字
                  pillSearchText = "";
                  const searchInput = document.getElementById("pill-search");
                  if (searchInput) {searchInput.value = "";}
                  subNav.querySelectorAll(".sub-btn")
                      .forEach(btn =>
                          btn.classList.remove("active")
                      );
                  button.classList.add("active");
                  renderBattleItems( mainCategory, subName );
              };
              subNav.appendChild(button);
          });
          if (subCategories.length > 0) { renderBattleItems( mainCategory, subCategories[0] ); }
      }


      // ==============================================
      // 計算單顆丹藥 × 已食用數量
      // ==============================================
      /*** 第四欄位：計算「功能累計」
       * @param {Object} item - 單顆丹藥資料
       * @param {Number} count - 已食用數量
       ***/
      function calculateTotalEffects(item, count) {
          const totalEffects = [];

          ATTRIBUTES_MAP.forEach(attr => {
          //-- 1. 取得丹藥「單顆」的基礎數值
              const baseNum = Number(item[attr.key]);
                //如果丹藥原本就「沒有」屬性 (0、空白、NaN)，直接跳過不顯示
              if (!Number.isFinite(baseNum) || baseNum === 0) return;
          //-- 2. 計算累計數值 (單價 * 食用數量)
              const total = cleanNumber(baseNum * count);
          //-- 3. 判斷是百分比還是一般整數 (依據單顆數值是否在 0 ~ 1 之間)
              if (baseNum > 0 && baseNum < 1) {
                  const percent = cleanNumber(total * 100, 6);
                  totalEffects.push(`${attr.short}+${percent}%,`);
              } else { totalEffects.push(`${attr.short}+${cleanNumber(total)},`);}
          });
          //-- 4. 如果 9 個屬性通通都沒有設定
          return totalEffects.length > 0 ? totalEffects.join(' ') : '無關戰力';
      }


      // ==============================================
      // 列表渲染 → 自動產生丹藥列表
      // ==============================================
      function renderBattleItems(mainCategory, subCategory) {
          const container = document.getElementById("battle-items");
          if (!container) return;
          container.innerHTML = "";

          //#判斷：上限有 # 符號就自動切換成收集介面！
          const isThresholdType = isThresholdSubCategory(subCategory);
          if (isThresholdType && !pillSearchText) {
              // #A. 門檻型渲染 (造型、八卦、神器等)
              const savedKey = `THRESHOLD__${mainCategory}__${subCategory}`;
              const currentAmount = Number(playerRecord.pills[savedKey]) || 0;
              const result = calculateThresholdStats(subCategory, currentAmount);

              const card = document.createElement("div");
              card.className = "card";
              card.style.padding = "10px";

              card.innerHTML = `<div class="threshold-header">
    <div>📊 當前進度：
        <input type="number" class="pill-count-input" id="threshold-input" value="${currentAmount}" min="0">
    </div>
</div>

<div class="threshold-summary-box">
    <strong>✨當前累計：</strong><br>
    <span id="threshold-summary">${result.summaryText}</span>
</div>

<table class="pill-table">
    <thead>
        <tr>
            <th>門檻項目</th>
            <th>獲得效果</th>
            <th class="col-status">狀態</th>
        </tr>
    </thead>
    <tbody id="threshold-table-body">
    ${generateTableRowsHtml(result.itemsStatus)}
    </tbody>
              `;

              // #B. 綁定數字輸入監聽 (門檻型專用)
              const input = card.querySelector("#threshold-input");
              input.addEventListener("input", function() {
                  let val = Number(this.value);
                  if (!Number.isFinite(val)) { val = 0; }
                  // 1. 動態取得該小分類的「最高門檻上限」 (例如 #24 -> 24)
                  const maxThreshold = getMaxThresholdForSubCategory(subCategory);
                  // 2. 進行範圍卡死 (大於最高門檻就強制彈回 maxThreshold)
                  if (maxThreshold > 0) {
                      val = Math.max(0, Math.min(val, maxThreshold));
                  } else { val = Math.max(0, val);}
                  // 3. 把校正後的數值寫回畫面輸入框 (輸入 300 會自動變成 24)
                  this.value = val;
                  // 4. 確保玩家已有名稱
                  ensurePlayerName();
                  // 5. 儲存紀錄
                  playerRecord.pills[savedKey] = val;
                  savePlayerRecord();
                  // 6. 局部更新戰力與表格
                  const updatedResult = calculateThresholdStats(subCategory, val);
                  const summarySpan = card.querySelector("#threshold-summary");
                  if (summarySpan) { summarySpan.textContent = updatedResult.summaryText; }
                  const tbody = card.querySelector("#threshold-table-body");
if (tbody) { tbody.innerHTML = generateTableRowsHtml(updatedResult.itemsStatus); }
              });

              container.appendChild(card);
              return;
          }
          
          // ======================================
          // ① 取得要顯示的資料
          // ======================================
          let items;

          if (pillSearchText) {
              // 全域搜尋：整份 battleDB
              items = battleDB.filter(item => {
                  const name = String(item.名稱 || "").trim();
                  const effects = [
                      formatEffect("攻", item.攻擊),
                      formatEffect("防", item.防禦),
                      formatEffect("爆", item.爆擊),
                      formatEffect("爆傷", item.爆傷),
                      formatEffect("抗爆", item.抗爆),
                      formatEffect("命中", item.命中),
                      formatEffect("閃", item.閃避),
                      formatEffect("反", item.反擊),
                      formatEffect("血", item.氣血),
                      String(item.其它功能 || "").trim()
                  ]
                  .filter(Boolean)
                  .join(" ");

                  // 第一欄：名稱 // 第二欄：效果
                  const searchText =
                      `${name} ${effects}`.toLowerCase();
                  return searchText.includes(pillSearchText);
              });
          } else {
              // 一般瀏覽：主分類＋小分類
              items = battleDB.filter(item =>
                  String(item.主分類 || "").trim() === mainCategory &&
                  String(item.小分類 || "").trim() === subCategory
              );
          }
          
          // ======================================
          // ② 沒有搜尋結果
          // ======================================
          if (items.length === 0) {
              container.innerHTML = `
                  <div class="card" style="text-align:center; padding:20px; color:#777;">
                      ${  pillSearchText
                          ? `⚠️ 找不到「${pillSearchText}」相關`
                          : `⚠️ 找不到符合「${subCategory}」的資料`
                      }
                  </div> `;
              return;
          }


          // ======================================
          // ③ 建立丹藥列表
          // ======================================
          items.forEach(item => {
              const name = String(item.名稱 || "無資料");
              const limit = parseMaxLimit(item.上限) || 0;
              const main = String(item.主分類 || "");
              const sub = String(item.小分類 || "");
              const pillKey =
                  `${main}__${sub}__${name}`;

              // 已食用數量
              const savedCount =
                  Number(playerRecord.pills[pillKey]) || 0;
              const count =
                  Math.max(0, Math.min(savedCount, limit));

              // 效果文字
              const effects = [
                  formatEffect("攻", item.攻擊),
                  formatEffect("防", item.防禦),
                  formatEffect("爆", item.爆擊),
                  formatEffect("爆傷", item.爆傷),
                  formatEffect("抗爆", item.抗爆),
                  formatEffect("命中", item.命中),
                  formatEffect("閃", item.閃避),
                  formatEffect("反", item.反擊),
                  formatEffect("血", item.氣血),
                  String(item.其它功能 || "").trim()
              ]
              .filter(Boolean);

              const effectText =
                  effects.length > 0
                  ? effects.join(" ")
                  : "無資料";

              // 累計效果
              const totalEffectText =
                  calculateTotalEffects(item, count);

              // 建立卡片
              const card =
                  document.createElement("div");
              card.className = "card";
              card.innerHTML = `
                  <table class="pill-table">
                      <tr>
                          <!-- 第一欄：名稱 -->
                          <td class="pill-name">${name}${pillSearchText?`<br>
                                     <small style=" color:#777; font-weight:normal;">[${main}-${sub}]
                                     </small>`: ""}
                          </td>
                          <!-- 第二欄：效果 -->
                          <td class="pill-text pill-effect" title="${effectText}">${effectText}
                          </td>
                      </tr>
                      <tr>
                          <!-- 已食用 -->
                          <td class="pill-count">
                              <input type="number" class="pill-count-input" value="${count}" min="0" max="${limit}" 
                              data-pill-key="${pillKey}" data-limit="${limit}">
                              <span>/${limit}</span>
                          </td>
                          <!-- 累計效果 -->
                          <td class="pill-text pill-total" title="${totalEffectText}">${totalEffectText}
                          </td>
                      </tr>
                  </table> `;
// ======================================
// 數量輸入
// ======================================
              const input = card.querySelector(".pill-count-input");
              input.addEventListener("input", function () {
          let value = Number(this.value);
          if (!Number.isFinite(value)) { value = 0; }

          // 【核心】動態判斷真正的上限 limit
          let realLimit = 0;
          const subCategory = String(item.小分類 || "").trim();

          // 如果這是一個門檻型分類，上限應該是「最高門檻數值」
          if (isThresholdSubCategory(subCategory)) {
              realLimit = getMaxThresholdForSubCategory(subCategory);
          } else { // 如果是一般丹藥，採用一般的 parseMaxLimit
              realLimit = parseMaxLimit(item.上限);}
          // 如果有找到上限 (>0)，才進行截斷限制
          if (realLimit > 0) {
              value = Math.max(0, Math.min(value, realLimit));
          } else { value = Math.max(0, value);} // 無上限時僅限制大於等於 0
          // 將矯正後的數字寫回 input 欄位 (ex: 輸入300 會自動變成套裝上限 24)
          this.value = value;

          // 確保玩家已有名稱 (呼叫共用函式)
          ensurePlayerName();

          // 儲存
          playerRecord.pills[pillKey] = value;
          savePlayerRecord();

          // 更新累計 (門檻型與普通丹藥各自處理)
          const totalElement = card.querySelector(".pill-total");
          if (totalElement) {
              let updatedTotal = "";
              if (isThresholdSubCategory(subCategory)) {
                  // 門檻型：呼叫門檻計算，取 summaryText
                  const thresholdResult = calculateThresholdStats(subCategory, value);
                  updatedTotal = thresholdResult.summaryText;
              } else {
                  // 普通丹藥：計算單筆丹藥加總
                  updatedTotal = calculateTotalEffects(item, value);
              }
              totalElement.textContent = updatedTotal;
              totalElement.title = updatedTotal;
          }
      });
              container.appendChild(card);

          });
      }
      

      // ==============================================
      //### 判斷小分類是否為「門檻/收集型系統」
      // ==============================================
      //  #1. 該小分類中有任何一筆資料的上限欄位 帶有 '#' 或 'Y' 
      // ==============================================
      function isThresholdSubCategory(subCategory) {
          if (!subCategory) return false;
          return battleDB.some(item =>
              String(item.小分類 || "").trim() === subCategory &&
              (String(item.上限 || "").includes("#") || String(item.上限 || "").toUpperCase().includes("Y"))
          );
      }
      // ==============================================
      // #2. 從上限欄位解析出真正的門檻數字 (如: "#4" 或 "Y4" -> 4)
      // ==============================================
      function getThresholdValue(item) {
          const raw = String(item.上限 || "").replace(/[^0-9]/g, ""); // 濾掉非數字字元
          return Number(raw) || 0;
      }
      // ==============================================
      // #3. 取得該小分類的「最高門檻值」 (例如: 從 #1,#5,#24 中找出 24)
      // ==============================================
      function getMaxThresholdForSubCategory(subCategory) {
          if (!subCategory) return 0;
          // 找出該小分類所有的門檻項目
          const items = battleDB.filter(item =>
              String(item.小分類 || "").trim() === subCategory
          );
          if (items.length === 0) return 0;
          // 將所有門檻轉為數字，並找出最大值
          const thresholdValues = items.map(item => getThresholdValue(item));
          return Math.max(...thresholdValues);
      }


      // ==============================================
      // #4. 計算門檻型系統（自動解析符號）
      // ==============================================
      function calculateThresholdStats(subCategory, currentAmount) {
          const thresholdItems = battleDB.filter(item =>
              String(item.小分類 || "").trim() === subCategory
          );
          const activeStats = { 攻擊:0, 防禦:0, 爆擊:0, 爆傷:0, 抗爆:0, 命中:0, 閃避:0, 反擊:0, 氣血:0 };
          thresholdItems.forEach(item => {
              const threshold = getThresholdValue(item); // 使用解析工具取得門檻數字
              // 判斷是否達成門檻
              if (currentAmount >= threshold && threshold > 0) {
              // 透過 key 取出全名與數值
              const fields = ATTRIBUTES_MAP.map(attr => [attr.key, item[attr.key]]);
                  fields.forEach(([fullLabel, val]) => {
                      const num = Number(val);
                      if (Number.isFinite(num) && num !== 0) { activeStats[fullLabel] += num; }
                  });
              }
          });

          // 格式化總戰力文字
          const summaryText = Object.entries(activeStats)
              .filter(([_, val]) => val > 0)
              .map(([label, val]) => formatEffect(label.substring(0,2), val).replace(',', ''))
              .join(" ");
          return {
              activeStats,
              summaryText: summaryText || "無屬性加成",
              itemsStatus: thresholdItems.map(item => {
                  const threshold = getThresholdValue(item);
                  return {
                      name: item.名稱,
                      threshold: threshold,
                      isUnlocked: currentAmount >= threshold && threshold > 0,
                      effectText: [
                          formatEffect("攻", item.攻擊), formatEffect("防", item.防禦),
                          formatEffect("爆", item.爆擊), formatEffect("爆傷", item.爆傷),
                          formatEffect("抗爆", item.抗爆), formatEffect("命中", item.命中),
                          formatEffect("閃", item.閃避), formatEffect("反", item.反擊),
                          formatEffect("血", item.氣血), String(item.其它功能 || "").trim()
                      ]
                      .filter(Boolean).join(" ")
                  };
              })
          };
      }





      // ==============================================
      // 搜尋觸發
      // ==============================================
      function searchPills() {
          const input =
              document.getElementById("pill-search");
          pillSearchText =
              input
                  ? input.value.trim().toLowerCase()
                  : "";
          // 取得目前分類
          const activeMain =
              document.querySelector(".main-tab.active");
          const mainCategory =
              activeMain
                  ? activeMain.textContent.trim()
                  : "";
          const activeSub =
              document.querySelector(".sub-btn.active");
          const subCategory =
              activeSub
                  ? activeSub.textContent.trim()
                  : "";
          renderBattleItems(
              mainCategory,
              subCategory
          );
      }


      // ==============================
      // 切換主分類
      // ==============================
      function switchMainTab(mainCategory) {
          // 切換主分類時，自動清空搜尋框與搜尋文字
          pillSearchText = "";
          const searchInput = document.getElementById("pill-search");
          if (searchInput) {searchInput.value = "";}

          // 先清除舊內容
          document.getElementById("battle-sub-nav").innerHTML = "";
          document.getElementById("battle-items").innerHTML = "";

          // 1. 主頁籤 Active
          document.querySelectorAll(".main-tab")
              .forEach(btn => {
                  btn.classList.remove("active");
                  if (btn.getAttribute("onclick") ===
                      `switchMainTab('${mainCategory}')`) {
                      btn.classList.add("active"); }
              });

          // 2. 找出目前主分類的資料
          const mainItems = battleDB.filter(item =>
              String(item.主分類 || "").trim() === mainCategory );
          console.log(`📂 主分類：${mainCategory}，找到 ${mainItems.length} 筆資料`);
          // 沒有資料
          if (mainItems.length === 0) {
              console.log(`ℹ️ ${mainCategory} 資料待更新`);
              document.getElementById("battle-items").innerHTML = `
                  <div class="card" style="text-align:center;">
                      <div style="font-size:1.1rem; margin-bottom:6px;">
                          📦 ${mainCategory}</div>
                      <div style="color:#777;">資料待更新</div>
                  </div> `;
              return;
          }

          // 3. 產生當前主分類的小分類
          renderSubTabs(mainCategory, mainItems);
      }



      // ==============================================
      // 多角色 LocalStorage 資料管理
      // ==============================================
      const STORAGE_KEY = "jin_pill_battle_record_multi";
      // 多角色主要資料結構
      let multiPlayerDB = {
          currentRole: "", // 目前選取
          roles: {}
      };
      // 全域使用的單一角色（保持相容性）
      let playerRecord = {
          playerName: "",
          pills: {},
          playerStats: { 攻擊: 0, 防禦: 0, 爆擊: 0, 爆傷: 0, 抗爆: 0, 命中: 0, 閃避: 0, 反擊: 0, 氣血: 0 }
      };


      // ==============================================
      // 讀取紀錄
      // ==============================================
      function loadPlayerRecord() {
          try {
              const saved = localStorage.getItem(STORAGE_KEY);
              if (saved) {
                  const data = JSON.parse(saved);
                  if (data && typeof data === "object" && data.roles) {
                      multiPlayerDB = data;
                  }
              }
          } catch (error) {
              console.error("❌ 讀取紀錄失敗：", error);
          }

          updateRoleSelectOptions();

          // 如果先前有選取的角色，直接載入
          if (multiPlayerDB.currentRole && multiPlayerDB.roles[multiPlayerDB.currentRole]) {
              loadRoleData(multiPlayerDB.currentRole);
          } else {
              clearCurrentRecordUI();
          }
      }


      // ==============================================
      // 儲存目前角色 (自動儲存)
      // ==============================================
      function savePlayerRecord() {
          try {
              const pName = playerRecord.playerName ? playerRecord.playerName.trim() : "";
              if (pName) {
                  multiPlayerDB.roles[pName] = JSON.parse(JSON.stringify(playerRecord));
                  multiPlayerDB.currentRole = pName;
              }
              localStorage.setItem(STORAGE_KEY, JSON.stringify(multiPlayerDB));
              updateRoleSelectOptions();
          } catch (error) {
              console.error("❌ 儲存失敗：", error);
          }
      }
      // ==============================================
      // 角色下拉選單（含 新增 與 刪除）
      // ==============================================
      function updateRoleSelectOptions() {
          const select = document.getElementById("role-select");
          if (!select) return;
          let html = `<option value="__NEW__">➕[新手加入]</option>`;
          // 加入已有角色
          const roleNames = Object.keys(multiPlayerDB.roles);
          roleNames.forEach(roleName => {
              const isSelected = (roleName === multiPlayerDB.currentRole) ? "selected" : "";
              html += `<option value="${roleName}" ${isSelected}>👤 ${roleName}</option>`;
          });

          // 若當前已有效角色，才顯示「刪除當前」選項
          if (multiPlayerDB.currentRole && multiPlayerDB.roles[multiPlayerDB.currentRole]) {
              html += `<option value="__DELETE__" style="color: red;">🗑️ [踢除當前：${multiPlayerDB.currentRole}]</option>`;
          }
          select.innerHTML = html;
      }

      // 下拉選單動作分流處理
      function handleRoleSelect(value) {
          if (value === "__NEW__") {
              // 僅清空畫面，不刪除任何資料
              clearCurrentRecordUI();
              showToast("✨ 已重置，新高手加入即可建立檔案！");
          } else if (value === "__DELETE__") {
              // 執行刪除當前角色
              deleteCurrentRole();
          } else {
              // 切換至選取的角色
              loadRoleData(value);
              showToast(`🔄 已切換至大俠：${value}`);
          }
      }


      // 載入特定角色資料到畫面
      function loadRoleData(roleName) {
          if (!multiPlayerDB.roles[roleName]) return;

          multiPlayerDB.currentRole = roleName;
          playerRecord = JSON.parse(JSON.stringify(multiPlayerDB.roles[roleName]));

          const nameInput = document.getElementById("player-name");
          if (nameInput) {
              nameInput.value = playerRecord.playerName || "";
          }
          searchPills(); // 重載列表與食用
          savePlayerRecord(); // 儲存目前的 currentRole 狀態
      }

      // // 清空畫面 (不影響 LocalStorage 已存角色)
      function clearCurrentRecordUI() {
          multiPlayerDB.currentRole = "";
          playerRecord = {
              playerName: "",
              pills: {},
              playerStats: { 攻擊: 0, 防禦: 0, 爆擊: 0, 爆傷: 0, 抗爆: 0, 命中: 0, 閃避: 0, 反擊: 0, 氣血: 0 }
          };

          const nameInput = document.getElementById("player-name");
          if (nameInput) nameInput.value = "";

          updateRoleSelectOptions();
          searchPills();
      }

      // ==============================================
      // 儲存/更新玩家名稱 (多角色相容版)
      // ==============================================
     function savePlayerName() {
          const input = document.getElementById("player-name");
          if (!input) return;

          const newName = input.value.trim();
          const oldName = playerRecord.playerName ? playerRecord.playerName.trim() : "";

          // 1. 若名字沒變或打空白，不做處理
          if (!newName || newName === oldName) {
              input.value = oldName; // 若打空白，自動還原舊名
              return;
          }

          // 2. 判斷是否為「修改現有角色名稱」
          if (oldName && multiPlayerDB.roles[oldName]) {
              // 跳出提示問使用者意圖
              const isRename = confirm(
                  `❓ ⚠️偵測到大俠名稱變更：\n\n` +
                  `按【 確定 】: 將原名「${oldName}」改名為「${newName}」\n` +
                  `按【 取消 】: 保留「${oldName}」，並以「${newName}」建立全新手`
              );

              if (isRename) {
                  // 使用者要「改名」：刪除舊 key
                  delete multiPlayerDB.roles[oldName];
                  showToast(`✏️ 大俠已改名為：${newName}`);
              } else {
                 // 選【取消】：舊角色必須完整保留，新角色則從空白開始。
            // 先把舊角色完整複製一份，避免後面的初始化/儲存流程影響舊資料。
            const oldRoleData = JSON.parse(JSON.stringify(
                multiPlayerDB.roles[oldName] || playerRecord
            ));
            // 確保舊角色一定留在 roles 裡。
            multiPlayerDB.roles[oldName] = oldRoleData;
            // 初始化目前畫面與 playerRecord，建立「全新手」的空白資料。
            clearCurrentRecordUI();
            // 新角色只設定名稱，其餘資料初始化
            playerRecord.playerName = newName;
            multiPlayerDB.currentRole = newName;
            const nameInput = document.getElementById("player-name");
            if (nameInput) nameInput.value = newName;
            // 儲存：此時 roles 會同時包含「舊角色 + 新角色」。
            savePlayerRecord();
            showToast(`✨ 已建立全新大俠：${newName}；「${oldName}」資料已保留`);
            return; // 不再執行下面的改名共用流程
        }
    } else {
        // 沒有舊角色：直接建立新角色
        playerRecord.playerName = newName;
        multiPlayerDB.currentRole = newName;
        savePlayerRecord();
        showToast(`✨ 新手已建檔：${newName}`);
        return;
    }
          // 3. 更新記憶體資料與當前選取角色
          playerRecord.playerName = newName;
          multiPlayerDB.currentRole = newName;

          savePlayerRecord();// 4. 自動儲存並更新下拉選單
      }



      // 刪除當前角色
      function deleteCurrentRole() {
          const roleToDelete = multiPlayerDB.currentRole;
          if (!roleToDelete || !multiPlayerDB.roles[roleToDelete]) return;

          if (confirm(`⚠️ 確定踢除大俠「${roleToDelete}」嗎？此動作無法復原！（建議先下載JSON備份）`)) {
              delete multiPlayerDB.roles[roleToDelete];
              //先清空資料與畫面
              clearCurrentRecordUI();
              //強制清空名稱輸入框（確保舊大名不殘留）
              const nameInput = document.getElementById("player-name");
              if (nameInput) { nameInput.value = "";}
              // 儲存變更並顯示提示
              savePlayerRecord();
              showToast(`🗑️ 已成功踢除：${roleToDelete}，若有下載備份，匯入 JSON 檔案，可取回大俠資料~`);
          } else {
              // 若點擊取消，還原下拉選單選取狀態
              updateRoleSelectOptions();
          }
      }



      // ==============================================
      // 戰力與剩餘需求計算核心
      // ==============================================
      function calculatePlayerStats() {
    // 初始化物件
    const stats = {};
    ATTRIBUTES_MAP.forEach(attr => { stats[attr.key] = 0; });
    const neededList = []; // 紀錄還需多少顆/套

    // ① 計算一般丹藥戰力 & 收集未吃滿清單
    battleDB.forEach(item => {
        const name = String(item.名稱 || "");
        const main = String(item.主分類 || "");
        const sub = String(item.小分類 || "");
        const limit = parseMaxLimit(item.上限) || 0;

        // 跳過門檻型的個別計算（下方統一用 threshold 算）
        if (["造型", "稱號", "足跡"].includes(sub)) return;

        const pillKey = `${main}__${sub}__${name}`;
        const count = Number(playerRecord.pills[pillKey]) || 0;

        // ✅ 修正：直接讀取單顆丹藥 item[attr.key] 的數值進行乘算
        if (count > 0) {
            ATTRIBUTES_MAP.forEach(attr => {
                const baseValue = Number(item[attr.key]);
                if (Number.isFinite(baseValue) && baseValue !== 0) {
                    stats[attr.key] += baseValue * count;
                }
            });
        }

        // 收集未吃滿清單
        if (limit > 0 && count < limit) {
            neededList.push({
                name: name,
                needed: limit - count
            });
        }
    });

    // ② 計算門檻型系統（造型/稱號等）的戰力
    const thresholdSubCategories = ["造型", "稱號", "足跡"]; // 可自行擴充
    thresholdSubCategories.forEach(sub => {
        // 尋找對應的主分類鍵
        const matchedItem = battleDB.find(i => String(i.小分類 || "").trim() === sub);
        if (matchedItem) {
            const main = String(matchedItem.主分類 || "").trim();
            const savedKey = `THRESHOLD__${main}__${sub}`;
            const currentAmount = Number(playerRecord.pills[savedKey]) || 0;

            const result = calculateThresholdStats(sub, currentAmount);
            Object.entries(result.activeStats).forEach(([key, val]) => {
                stats[key] += val;
            });
        }
    });

    // ③ 加上玩家自行輸入面板數值...
    const playerStats = playerRecord.playerStats || {};
    Object.keys(stats).forEach(key => {
        const value = Number(playerStats[key]) || 0;
        stats[key] += value;
    });

    // ④ 清理小數點
    Object.keys(stats).forEach(key => {
        stats[key] = cleanNumber(stats[key], 6);
    });

    return { stats, neededList };
}


      // ==============================================
      // 渲染 Modal 畫面內容
      // ==============================================
      function updateStatsModal() {
          const { stats, neededList } = calculatePlayerStats();

          // 1. 渲染屬性
          const summaryContainer = document.getElementById("stat-summary-list");
          summaryContainer.innerHTML = Object.entries(stats)
              .map(([attr, val]) => `<div><strong>${attr}:</strong> ${val}</div>`)
              .join("");

          // 2. 渲染剩餘需求
          const neededContainer = document.getElementById("stat-needed-list");
          if (neededList.length === 0) {
              neededContainer.innerHTML = `<li style="color:#16a34a;">🎉 恭喜！所有丹藥均已食用完畢！</li>`;
          } else {
              neededContainer.innerHTML = neededList
                  .map(item => `<li><strong>${item.name}:</strong> 還需 ${item.needed} 顆</li>`)
                  .join("");
          }
      }

      // 開關統計視窗
      function toggleModal(show) {
          if (show) { updateStatsModal();}
          document.getElementById("stats-modal").style.display =
              show ? "flex" : "none";
      }


      // ==============================================
      // 產生分享格式文字
      // ==============================================
      function generateShareText() {
          const { stats, neededList } = calculatePlayerStats();
          const pName = playerRecord.playerName || "無名大俠";

          let text = `【大俠：${pName} 的戰力統計】\n\n`;
          text += `【總累計戰力】\n`;
          Object.entries(stats).forEach(([attr, val]) => {
              text += `${attr}: ${val}\n`;
          });

          text += `\n【剩餘需求 / 願望清單】\n`;
          if (neededList.length === 0) {
              text += `丹藥已全數吃滿！\n`;
          } else {
              neededList.forEach(item => {
                  text += `${item.name}: 還需 ${item.needed} 顆\n`;
              });
          }
          return text;
      }

      // 匯入 JSON 檔案
      function importDataBackup(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function(e) {
              try {
                  const importedData = JSON.parse(e.target.result);
                  // 驗證匯入的資料格式
                  if (importedData && typeof importedData === 'object' && importedData.pills) {
                      playerRecord = importedData;
                      savePlayerRecord(); // 寫入 LocalStorage[cite: 1]
                      // 更新 UI[cite: 1]
                      const nameInput = document.getElementById("player-name");
                      if (nameInput) nameInput.value = playerRecord.playerName || "";

                      searchPills(); // 重新渲染畫面[cite: 1]
                      showToast(`✅ 成功載入大俠【${playerRecord.playerName || '無名'}】的紀錄！`);
                  } else {
                      alert("❌ 備份檔案格式不正確！");
                  }
              } catch (err) {
                  console.error("匯入失敗：", err);
                  alert("❌ 讀取檔案失敗，請確認是否為正確的 JSON 備份檔！");
              }
          };
          reader.readAsText(file);
          event.target.value = ""; // 清空 input 讓同檔名可重複觸發
      }

      // ==============================================
      // 按鈕功能：下載備份 / 複製 / 分享
      // ==============================================
      // 1. 匯出完整 JSON 備份檔案
      function exportDataBackup() {
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(playerRecord, null, 2));
          const downloadAnchor = document.createElement('a');
          const fileName = `${playerRecord.playerName || '大俠'}_戰力備份.json`;//`

          downloadAnchor.setAttribute("href", dataStr);
          downloadAnchor.setAttribute("download", fileName);
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          downloadAnchor.remove();
      }

      // 2. 複製分享文字到剪貼簿
      function copyShareText() {
          const text = generateShareText();
          navigator.clipboard.writeText(text).then(() => {
              alert("📋 戰力統計文字已成功複製到剪貼簿！");
          }).catch(err => {
              console.error("複製失敗：", err);
              alert("複製失敗，請手動複製。");
          });
      }

      // 3. 原生 Web Share API (支援手機彈出 LINE / 簡訊等)
      async function shareToLineOrOther() {
          const text = generateShareText();
          if (navigator.share) {
              try {
                  await navigator.share({
                      title: '大俠丹藥紀錄戰力統計',
                      text: text,
                  });
              } catch (err) {
                  console.log("取消分享或分享失敗", err);
              }
          } else {
              // 不支援 Web Share 時回退至複製
              copyShareText();
          }
      }

      // 4. 下載記事本 (.txt)
      function downloadTxtFile(playerName) {
          const textContent = generateShareText();
          const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `${playerName}_戰力統計表.txt`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(link.href);
      }
      // 5. 下載圖檔 (.png)
      function downloadPngImage(playerName) {
          const captureTarget = document.getElementById("capture-area");
          if (!captureTarget) return;
          // 提示計算中
          const btn = event.target;
          const originalText = btn.textContent;
          btn.textContent = "⏳ 圖片生成中...";
          html2canvas(captureTarget, {
              scale: 2, // 提升圖片解析度
              backgroundColor: "#ffffff"
          }).then(canvas => {
              const link = document.createElement("a");
              link.download = `${playerName}_戰力統計圖.png`;
              link.href = canvas.toDataURL("image/png");
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              btn.textContent = originalText;
          }).catch(err => {
              console.error("生成圖片失敗：", err);
              alert("生成圖片失敗，請重試！");
              btn.textContent = originalText;
          });
      }
      // 6. 下載 PDF (.pdf)
      function downloadPdfDocument() {
          // 呼叫瀏覽器列印，使用者可直接選擇「另存為 PDF」
          window.print(); }

      // ==============================================
      // 依玩家選擇的格式進行下載 (txt / png / pdf / json)
      // ==============================================
      function exportSelectedFormat() {
          const format = document.getElementById("export-format").value;
          const playerName = playerRecord.playerName || "大俠";
          if (format === "txt") {
              downloadTxtFile(playerName);
          } else if (format === "png") {
              downloadPngImage(playerName);
          } else if (format === "pdf") {
              downloadPdfDocument();
          } else if (format === "json") { // 新增分支
              exportDataBackup(); // 呼叫原本程式碼中的 exportDataBackup()
          }
      }



      // ==============================================
      //-- 共用邏輯函數
      // ==============================================
      // 確保有名稱可紀錄（若為空則自動給予預設名稱）
      function ensurePlayerName() {
          let currentName = playerRecord.playerName ? playerRecord.playerName.trim() : "";
          if (!currentName) {
              const now = new Date();
              const month = String(now.getMonth() + 1).padStart(2, '0');
              const day = String(now.getDate()).padStart(2, '0');
              currentName = `高手${month}${day}`;
              // 更新資料與 UI
              playerRecord.playerName = currentName;
              const nameInput = document.getElementById("player-name");
              if (nameInput) nameInput.value = currentName; }
          return currentName;
      }
      // 獨立：統一更新丹藥/門檻數值並自動存檔
      function updatePillRecord(key, value) {
        ensurePlayerName() // 確保大俠有名稱
        playerRecord.pills[key] = value
        savePlayerRecord() // 自動存檔
      }

      //  獨立：提取單一物件的所有戰力效果文字陣列
      function extractItemEffects(item) {
        // 依序取出 9 個屬性並格式化
        const effects = ATTRIBUTES_MAP
          .map((attr) => formatEffect(attr.short, item[attr.key])
        ).filter(Boolean)
        const other = String(item.其它功能 || '').trim();
        if (other) effects.push(other);
        return effects;
      }

      // 獨立：清空搜尋列邏輯
      function resetSearchInput() {
        pillSearchText = ''
        const searchInput = document.getElementById('pill-search')
        if (searchInput) {searchInput.value = ''}
      }

      /*** 專門解析上限欄位 (可處理純數字"n" 或帶有井號的'#1')
       * @param {any} maxVal - JSON 資料庫中的上限欄位值
       * @returns {number} 解析後的純數字 (無上限或解析失敗傳 0)
       ***/
      function parseMaxLimit(maxVal) {
          if (maxVal === null || maxVal === undefined) return 0;
          // 將輸入轉為字串並去除空白
          const str = String(maxVal).trim();
          if (!str) return 0;
          // 如果包含 # 符號，把 # 拆開取後面的數字；否則直接取原字串
          const numPart = str.includes('#') ? str.split('#')[1] : str;
          // 轉成數字 (若解析失敗傳 0)
          const num = Number(numPart);
          return Number.isFinite(num) ? num : 0;
      }

      function handlePillInput(inputEl, key, maxLimit) {
          let val = Number(inputEl.value) || 0;
          if (val < 0) val = 0;
          // 如果有設定上限且輸入超額，自動設為最大值
          if (maxLimit > 0 && val > maxLimit) {
              val = maxLimit;
              inputEl.value = maxLimit; // 自動將輸入框數字改回 24
          }

          updatePillRecord(key, val);
      }

// ==============================================

// ==============================================
function generateTableRowsHtml(itemsStatus) {
    if (!itemsStatus || !Array.isArray(itemsStatus)) return "";
    return itemsStatus.map(st => `
        <tr class="${st.isUnlocked ? 'unlocked' : 'locked'}">
            <td>${st.name}</td>
            <td>${st.effectText}</td>
            <td class="col-status">
                ${st.isUnlocked ? '✅ 已解鎖' : '🔒 未達成'}
            </td>
        </tr>
    `).join('');
}


      // Toast 
let toastTimer = null;
function showToast(message) {
    const toast = document.querySelector('.toast-msg');
    toast.textContent = message;
    toast.classList.remove('show'); //防連續
    clearTimeout(toastTimer);
    void toast.offsetWidth; // 強制重繪 (Reflow)
    toast.classList.add('show');
    toastTimer = setTimeout(() => { //結束後清除 class
        toast.classList.remove('show');
    }, 4000);
}

                  if (e.key === "Escape") {
                      searchInput.value = "";
                      searchPills();} });}

          loadBattleStats();//載入資料庫
